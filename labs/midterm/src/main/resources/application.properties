spring.main.web-application-type=none
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/css}
spring.datasource.username=${DB_USER:css}
spring.datasource.password=${DB_PASSWORD:css}
# Flyway creates the schema. Hibernate only validates it.
spring.sql.init.mode=never
spring.flyway.default-schema=appointment_midterm
spring.flyway.schemas=appointment_midterm
spring.jpa.properties.hibernate.default_schema=appointment_midterm
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
